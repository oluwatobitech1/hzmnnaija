<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline · HymnNaija</title>
<meta name="description" content="You're currently offline. Previously viewed hymns are still available.">
<meta name="theme-color" content="#1e2a52">
<link rel="icon" href="favicon.ico">
<script>
  (function () {
    try {
      var pref = JSON.parse(localStorage.getItem("hymnnaija:theme") || '"system"');
      if (pref === "light" || pref === "dark") document.documentElement.setAttribute("data-theme", pref);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="offline">
<div class="app-shell">
<main id="main" style="display:flex;align-items:center;min-height:100dvh;">
  <div class="state-block" style="padding:var(--sp-6) var(--sp-4)">
    <div class="state-block__icon">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 8.8a15 15 0 0114-2M8.5 12.3a9.5 9.5 0 019-1.2M12 16v.1M12 16a4.7 4.7 0 013.3 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <h3>You're offline</h3>
    <p>This page hasn't been saved for offline use yet. Hymns you've already opened are still available from Home and your Favorites.</p>
    <a class="btn btn--primary" href="index.html">Go to Home</a>
  </div>
</main>
</div>
</body>
</html>
